<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Páginaz Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
 .block-preview:hover.block-toolbar { opacity: 1; }
  [contenteditable]:focus { outline: 2px solid #3b82f6; border-radius: 4px; }
</style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden">

<div class="flex h-full">
  <!-- Sidebar izquierdo: Bloques -->
  <div class="w-64 bg-white border-r border-slate-200 p-4 overflow-y-auto">
    <div class="flex items-center gap-2 mb-6">
      <div class="w-8 h-8 bg-slate-900 rounded-lg"></div>
      <span class="font-bold text-lg">Páginaz</span>
    </div>
    
    <p class="text-xs font-semibold text-slate-500 mb-3 uppercase">Agregar bloques</p>
    <div class="space-y-2">
      <button onclick="addBlock('hero')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 border border-slate-200 flex items-center gap-3">
        <i data-lucide="layout-template" class="w-4 h-4"></i> Portada Hero
      </button>
      <button onclick="addBlock('titulo')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 border border-slate-200 flex items-center gap-3">
        <i data-lucide="heading-1" class="w-4 h-4"></i> Título
      </button>
      <button onclick="addBlock('texto')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 border border-slate-200 flex items-center gap-3">
        <i data-lucide="text" class="w-4 h-4"></i> Texto
      </button>
      <button onclick="addBlock('imagen')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 border border-slate-200 flex items-center gap-3">
        <i data-lucide="image" class="w-4 h-4"></i> Imagen
      </button>
      <button onclick="addBlock('boton')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 border border-slate-200 flex items-center gap-3">
        <i data-lucide="mouse-pointer-click" class="w-4 h-4"></i> Botón
      </button>
      <button onclick="addBlock('columnas')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 border border-slate-200 flex items-center gap-3">
        <i data-lucide="columns-3" class="w-4 h-4"></i> 3 Columnas
      </button>
      <button onclick="addBlock('whatsapp')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 border border-slate-200 flex items-center gap-3">
        <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
      </button>
    </div>
  </div>

  <!-- Centro: Canvas -->
  <div class="flex-1 flex flex-col">
    <!-- Top bar -->
    <div class="bg-white border-b border-slate-200 p-3 flex justify-between items-center">
      <input id="pageName" value="mi-pagina" class="font-semibold bg-slate-100 px-3 py-1 rounded-lg text-sm">
      <div class="flex gap-2">
        <button onclick="togglePreview()" id="previewBtn" class="px-4 py-2 text-sm font-semibold rounded-lg border border-slate-300 hover:bg-slate-50">
          Vista previa
        </button>
        <button onclick="exportHTML()" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-900 text-white hover:bg-slate-700">
          Publicar
        </button>
      </div>
    </div>
    
    <!-- Página que se está creando -->
    <div class="flex-1 overflow-y-auto bg-slate-200 p-8">
      <div id="canvas" class="max-w-4xl mx-auto bg-white min-h-full shadow-2xl">
        <div id="pageContent" class="min-h-[800px]"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Exportar -->
<div id="exportModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl max-w-2xl w-full p-6">
    <h3 class="text-lg font-bold mb-4">Tu página está lista</h3>
    <p class="text-sm text-slate-600 mb-4">Copia este código en un archivo `index.html` y súbelo a GitHub Pages o Netlify.</p>
    <textarea id="exportCode" class="w-full h-64 text-xs font-mono p-3 bg-slate-100 rounded-lg border"></textarea>
    <div class="flex justify-end gap-2 mt-4">
      <button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold rounded-lg border">Cerrar</button>
      <button onclick="copyCode()" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-900 text-white">Copiar código</button>
    </div>
  </div>
</div>

<script>
let blocks = [];
let isPreview = false;
lucide.createIcons();

function addBlock(type) {
  const id = Date.now();
  let block = { id, type };
  
  if(type === 'hero') block = {...block, titulo: 'Tu título increíble aquí', subtitulo: 'Describe tu negocio en una línea', boton: 'Contáctame', img: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?q=80&w=1000'};
  if(type === 'titulo') block.contenido = 'Título de sección';
  if(type === 'texto') block.contenido = 'Escribe aquí tu texto. Puedes borrar esto y poner lo que quieras.';
  if(type === 'imagen') block.url = 'https://via.placeholder.com/800x400';
  if(type === 'boton') block = {...block, texto: 'Click aquí', link: '#'};
  if(type === 'columnas') block = {...block, col1: 'Servicio 1', col2: 'Servicio 2', col3: 'Servicio 3'};
  if(type === 'whatsapp') block.numero = '528100000000';
  
  blocks.push(block);
  render();
}

function render() {
  const page = document.getElementById('pageContent');
  page.innerHTML = '';
  
  if(blocks.length === 0) {
    page.innerHTML = `<div class="flex items-center justify-center h-[800px] text-slate-400">
      <div class="text-center"><i data-lucide="mouse-pointer-click" class="w-12 h-12 mx-auto mb-4"></i><p>Agrega tu primer bloque desde la izquierda</p></div>
    </div>`;
    lucide.createIcons();
    return;
  }

  blocks.forEach((b, i) => {
    const div = document.createElement('div');
    div.className = 'block-preview relative group';
    
    let html = '';
    if(b.type === 'hero') {
      html = `<section class="px-6 py-20 md:py-32">
        <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">
          <div>
            <h1 contenteditable="${!isPreview}" onblur="updateBlock(${i}, 'titulo', this.innerText)" class="text-4xl md:text-5xl font-bold mb-6">${b.titulo}</h1>
            <p contenteditable="${!isPreview}" onblur="updateBlock(${i}, 'subtitulo', this.innerText)" class="text-lg text-slate-600 mb-8">${b.subtitulo}</p>
            <a href="#" class="inline-block bg-slate-900 text-white px-6 py-3 rounded-lg font-semibold">${b.boton}</a>
          </div>
          <img src="${b.img}" class="rounded-2xl shadow-xl w-full h-[400px] object-cover">
        </div>
      </section>`;
    }
    if(b.type === 'titulo') html = `<div class="px-6 py-8"><h2 contenteditable="${!isPreview}" onblur="updateBlock(${i}, 'contenido', this.innerText)" class="text-3xl font-bold text-center">${b.contenido}</h2></div>`;
    if(b.type === 'texto') html = `<div class="px-6 py-4 max-w-3xl mx-auto"><p contenteditable="${!isPreview}" onblur="updateBlock(${i}, 'contenido', this.innerText)" class="text-slate-700">${b.contenido}</p></div>`;
    if(b.type === 'imagen') html = `<div class="px-6 py-4"><img src="${b.url}" class="rounded-lg w-full"></div>`;
    if(b.type === 'boton') html = `<div class="px-6 py-4 text-center"><a href="${b.link}" class="inline-block bg-slate-900 text-white px-6 py-3 rounded-lg font-semibold">${b.texto}</a></div>`;
    if(b.type === 'columnas') {
      html = `<div class="px-6 py-12 bg-slate-50"><div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-lg border"><h3 contenteditable="${!isPreview}" onblur="updateBlock(${i}, 'col1', this.innerText)" class="font-bold mb-2">${b.col1}</h3><p class="text-sm text-slate-600">Descripción</p></div>
        <div class="bg-white p-6 rounded-lg border"><h3 contenteditable="${!isPreview}" onblur="updateBlock(${i}, 'col2', this.innerText)" class="font-bold mb-2">${b.col2}</h3><p class="text-sm text-slate-600">Descripción</p></div>
        <div class="bg-white p-6 rounded-lg border"><h3 contenteditable="${!isPreview}" onblur="updateBlock(${i}, 'col3', this.innerText)" class="font-bold mb-2">${b.col3}</h3><p class="text-sm text-slate-600">Descripción</p></div>
      </div></div>`;
    }
    if(b.type === 'whatsapp') html = `<div class="px-6 py-12 bg-slate-900 text-white text-center"><a href="https://wa.me/${b.numero}" class="inline-block bg-green-500 px-8 py-4 rounded-lg font-bold">WhatsApp: ${b.numero}</a></div>`;
    
    if(!isPreview) {
      html += `<div class="block-toolbar opacity-0 absolute -top-3 right-3 bg-white border border-slate-200 rounded-lg shadow-lg flex">
        <button onclick="moveBlock(${i}, -1)" class="p-2 hover:bg-slate-50"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
        <button onclick="moveBlock(${i}, 1)" class="p-2 hover:bg-slate-50"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
        <button onclick="deleteBlock(${i})" class="p-2 hover:bg-red-50 text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>`;
    }
    
    div.innerHTML = html;
    page.appendChild(div);
  });
  lucide.createIcons();
}

function updateBlock(i, key, val) { blocks[i][key] = val; }
function deleteBlock(i) { blocks.splice(i, 1); render(); }
function moveBlock(i, dir) { 
  const newI = i + dir;
  if(newI >= 0 && newI < blocks.length) { [blocks[i], blocks[newI]] = [blocks[newI], blocks[i]]; render(); }
}
function togglePreview() { 
  isPreview =!isPreview; 
  document.getElementById('previewBtn').innerText = isPreview? 'Editar' : 'Vista previa';
  render(); 
}

function exportHTML() {
  isPreview = true; render();
  const content = document.getElementById('pageContent').innerHTML;
  const fullHTML = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${document.getElementById('pageName').value}</title>
<script src="https://cdn.tailwindcss.com"><\/script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body>${content}</body>
</html>`;
  
  document.getElementById('exportCode').value = fullHTML;
  document.getElementById('exportModal').classList.remove('hidden');
  isPreview = false; render();
}

function closeModal() { document.getElementById('exportModal').classList.add('hidden'); }
function copyCode() { 
  navigator.clipboard.writeText(document.getElementById('exportCode').value);
  alert('Código copiado. Pégalo en index.html'); 
}

// Demo inicial
addBlock('hero');
addBlock('columnas');
addBlock('whatsapp');
</script>
</body>
 </html>
